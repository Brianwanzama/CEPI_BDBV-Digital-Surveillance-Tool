# Local or single-server deployment: PostgreSQL + BDBV API (which also serves the app).
#   cp .env.example .env      # then set the secrets
#   docker compose up -d      # app at http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bdbv
      POSTGRES_USER: bdbv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bdbv -d bdbv"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    image: ${API_IMAGE:-bdbv-api:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bdbv:${POSTGRES_PASSWORD}@db:5432/bdbv
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ characters)}
      DATA_MODE: synthetic
      SEED_DEMO: ${SEED_DEMO:-true}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "${PORT:-8080}:8080"
volumes:
  pgdata:
