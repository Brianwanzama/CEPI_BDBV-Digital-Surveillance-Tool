# Tests on every push and pull request; builds the container image, and publishes it
# to GitHub Container Registry (ghcr.io/<owner>/<repo>) on pushes to main.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bdbv_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # CI-only values; real deployments set their own secrets.
      JWT_SECRET: ci-only-secret-not-for-production-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            tools/package-lock.json

      - name: Unit tests (scoring, voice extraction, Kiswahili coverage)
        run: |
          node tests/scoring.test.js
          node tests/voice.test.js
          node tests/i18n.test.js

      - name: Boundary import tool test (synthetic shapes)
        working-directory: tools
        run: |
          npm ci
          node ../tests/boundaries.test.js

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend API tests (PostgreSQL)
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/bdbv_test
        run: npm test

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Browser tests (offline app)
        run: |
          node tests/e2e.test.js
          node tests/e2e_v2.test.js

      - name: Start the API with synthetic data
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/bdbv_e2e
          SEED_DEMO: "true"
          SEED_DEMO_DATA: "true"
          SEED_USER_PASSWORD: ci-demo-password
          AI_PROVIDER: mock
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE bdbv_e2e"
          node backend/src/server.js > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8080/api/v1/health && break; sleep 1; done

      - name: Browser tests against the API
        env:
          BASE_URL: http://localhost:8080
          DEMO_PASSWORD: ci-demo-password
        run: |
          node tests/e2e_server.test.js
          node tests/e2e_flow.test.js
          node tests/e2e_phase1.test.js

      - name: Server log
        if: always()
        run: cat server.log || true

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name (lower case)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
