<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f3d5e">
<title>BDBV Triage et Surveillance</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="banner" class="banner" role="note"></div>
<header class="top">
  <div class="brand"><h1 id="title"></h1><p id="subtitle"></p></div>
  <div class="ctrls">
    <label><span class="sr">Role / Rôle</span><select id="role" aria-label="Role / Rôle"></select></label>
    <label><span class="sr">Language / Langue</span><select id="lang" aria-label="Language / Langue"><option value="en">English</option><option value="fr">Français</option></select></label>
    <label class="net"><input type="checkbox" id="net" checked> <span id="netdot" class="dot on"></span> <span id="netlabel"></span></label>
    <button id="syncbtn" class="ghost"></button>
  </div>
</header>
<nav id="nav" class="nav" aria-label="Navigation"></nav>
<main id="view"></main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="ask" class="ask" hidden></div>
<footer class="foot" id="foot"></footer>
<script src="rules.js"></script>
<script src="geo.js"></script>
<script src="i18n.js"></script>
<script src="scoring.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
</script>
</body>
</html>
